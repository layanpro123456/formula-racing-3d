<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="100%" height="100%" role="img" aria-label="Formula Racing 3D">
  <!-- Ink-tinted container -->
  <rect x="1" y="1" width="878" height="182" rx="16" fill="#0b0d14" stroke="#222736" stroke-width="1.5"/>

  <!-- Subtle architectural telemetry gridlines -->
  <line x1="24" y1="138" x2="856" y2="138" stroke="#181c28" stroke-width="1"/>
  <line x1="164" y1="24" x2="164" y2="160" stroke="#181c28" stroke-width="1"/>

  <!-- Flat geometric motorsport mark -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="92" height="92" rx="12" fill="#11141c" stroke="#222736" stroke-width="1.2"/>
    <path d="M22 62 L36 28 H70" fill="none" stroke="#eef0f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M29 45 H58" fill="none" stroke="#e10600" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="64" cy="62" r="5" fill="#eef0f5"/>
    <rect x="22" y="74" width="22" height="3" rx="1.5" fill="#e10600"/>
  </g>

  <!-- Brand title and plain description -->
  <g transform="translate(192, 0)">
    <text x="0" y="80" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="40" font-weight="600" letter-spacing="-1" fill="#eef0f5">
      Formula Racing 3D
    </text>
    <text x="0" y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#a3a9b8">
      Deterministic 3D open-wheel motorsport simulator in the browser
    </text>

    <!-- Bottom metadata bar -->
    <g transform="translate(0, 159)">
      <circle cx="4" cy="-4" r="3.5" fill="#4cc38a"/>
      <text x="16" y="0" font-family="'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12.5" font-weight="400" fill="#a3a9b8">
        Next.js 14 · Babylon.js 9 · Havok Physics WASM · WebGL 2.0
      </text>
      <text x="640" y="0" text-anchor="end" font-family="'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace" font-size="12.5" font-weight="400" fill="#7a8296">
        60/120 FPS · MIT
      </text>
    </g>
  </g>
</svg>
