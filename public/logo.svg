<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for badge container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>

    <!-- Racing Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1e1e"/>
      <stop offset="60%" stop-color="#e10600"/>
      <stop offset="100%" stop-color="#b30000"/>
    </linearGradient>

    <!-- Speed Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="10%" stop-color="#11998e"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>

    <!-- Chrome / Carbon Streak Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d8e0ea"/>
      <stop offset="55%" stop-color="#8fa0b5"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="speedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Chamfered Corners -->
  <rect x="6" y="6" width="868" height="188" rx="20" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2"/>
  
  <!-- Subtle Carbon Pattern Line Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="20" y1="20" x2="260" y2="180"/>
    <line x1="60" y1="20" x2="300" y2="180"/>
    <line x1="100" y1="20" x2="340" y2="180"/>
    <line x1="140" y1="20" x2="380" y2="180"/>
    <line x1="180" y1="20" x2="420" y2="180"/>
    <line x1="220" y1="20" x2="460" y2="180"/>
  </g>

  <!-- Aerodynamic Racing Chevron & Speed Icon (Left Emblem) -->
  <g transform="translate(42, 34)">
    <!-- Speed streaks in back -->
    <path d="M 0 95 L 35 30 L 70 30 L 35 95 Z" fill="#ff1e1e" opacity="0.4"/>
    <path d="M 28 95 L 63 30 L 98 30 L 63 95 Z" fill="#e10600" opacity="0.7"/>

    <!-- Dynamic Formula Rear Wing & Halo Silhouette -->
    <!-- Rear Wing Endplate -->
    <polygon points="12,20 28,12 40,12 24,65 8,65" fill="#4a5568"/>
    <polygon points="26,18 70,18 64,28 22,28" fill="url(#redGrad)"/>
    <polygon points="24,32 78,32 72,42 20,42" fill="url(#cyanGrad)"/>

    <!-- Slanted Aerodynamic Monocoque Body -->
    <path d="M 45 78 C 65 74, 90 68, 125 58 C 145 52, 165 42, 172 38 L 178 45 C 165 55, 140 68, 110 78 C 88 86, 62 92, 45 94 Z" fill="url(#chromeGrad)"/>
    
    <!-- Red Vortex Streak -->
    <path d="M 40 92 L 155 42 L 142 38 L 25 88 Z" fill="url(#redGrad)" filter="url(#speedGlow)"/>

    <!-- Front Wing Assembly -->
    <polygon points="148,46 178,38 184,42 154,54" fill="#00f0ff" filter="url(#accentGlow)"/>
    <polygon points="160,54 186,46 190,50 164,60" fill="#ffffff"/>

    <!-- Wheels (Stylized Pirelli-style slicks) -->
    <!-- Rear Wheel -->
    <circle cx="48" cy="88" r="24" fill="#111622" stroke="#2c384e" stroke-width="4"/>
    <circle cx="48" cy="88" r="14" fill="#1b2333" stroke="#e10600" stroke-width="3"/>
    <circle cx="48" cy="88" r="5" fill="#ffffff"/>

    <!-- Front Wheel -->
    <circle cx="152" cy="62" r="19" fill="#111622" stroke="#2c384e" stroke-width="3.5"/>
    <circle cx="152" cy="62" r="11" fill="#1b2333" stroke="#00f0ff" stroke-width="2.5"/>
    <circle cx="152" cy="62" r="4" fill="#ffffff"/>

    <!-- Aerodynamic Underglow / Ground Effect Streak -->
    <line x1="20" y1="116" x2="185" y2="116" stroke="url(#redGrad)" stroke-width="4" stroke-linecap="round" filter="url(#accentGlow)"/>
    <line x1="60" y1="124" x2="160" y2="124" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vertical Divider / Telemetry Bar -->
  <line x1="262" y1="36" x2="262" y2="164" stroke="#222f46" stroke-width="2"/>
  <rect x="259" y="70" width="6" height="50" rx="3" fill="url(#redGrad)"/>

  <!-- Typography & Brand Text -->
  <g transform="translate(290, 0)">
    <!-- Sub-heading / Eyebrow Tag -->
    <g transform="translate(4, 48)">
      <rect x="0" y="-14" width="138" height="20" rx="4" fill="#e10600" opacity="0.18"/>
      <rect x="0" y="-14" width="4" height="20" rx="2" fill="#e10600"/>
      <text x="12" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="800" fill="#ff4d4d" letter-spacing="3">BABYLON.JS 3D</text>

      <rect x="150" y="-14" width="168" height="20" rx="4" fill="#00f0ff" opacity="0.14"/>
      <rect x="150" y="-14" width="4" height="20" rx="2" fill="#00f0ff"/>
      <text x="162" y="0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="800" fill="#00f0ff" letter-spacing="3">HAVOK PHYSICS</text>
    </g>

    <!-- Main Title: FORMULA RACING -->
    <text x="0" y="112" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="64" letter-spacing="2">
      <tspan fill="#ffffff">FORMULA</tspan>
      <tspan dx="16" fill="url(#redGrad)">RACING</tspan>
    </text>

    <!-- 3D Speed Badge -->
    <g transform="translate(450, 62)">
      <!-- Angled Parallelogram Badge -->
      <polygon points="12,0 92,0 80,48 0,48" fill="url(#cyanGrad)" filter="url(#accentGlow)"/>
      <polygon points="16,4 88,4 78,44 6,44" fill="#08101e"/>
      <text x="47" y="34" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-style="italic" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="1">3D</text>
    </g>

    <!-- Tagline / Subtitle -->
    <text x="2" y="148" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="600" fill="#8fa0b5" letter-spacing="2">
      NEXT-GEN MOTORSPORT SIMULATOR <tspan fill="#ff3333">|</tspan> WEB AUDIO <tspan fill="#ff3333">|</tspan> LIVE AI GRID
    </text>

    <!-- Decorative Apex Kerb Stripes -->
    <g transform="translate(2, 166)">
      <polygon points="0,0 20,0 12,8 0,8" fill="#e10600"/>
      <polygon points="20,0 40,0 32,8 12,8" fill="#ffffff"/>
      <polygon points="40,0 60,0 52,8 32,8" fill="#e10600"/>
      <polygon points="60,0 80,0 72,8 52,8" fill="#ffffff"/>
      <polygon points="80,0 100,0 92,8 72,8" fill="#e10600"/>
      <polygon points="100,0 120,0 112,8 92,8" fill="#ffffff"/>
      <polygon points="120,0 140,0 132,8 112,8" fill="#e10600"/>
      <polygon points="140,0 160,0 152,8 132,8" fill="#ffffff"/>
      <polygon points="160,0 180,0 172,8 152,8" fill="#e10600"/>
      <polygon points="180,0 200,0 192,8 172,8" fill="#ffffff"/>
      <polygon points="200,0 220,0 212,8 192,8" fill="#e10600"/>
      <polygon points="220,0 240,0 232,8 212,8" fill="#ffffff"/>
    </g>
  </g>
</svg>
